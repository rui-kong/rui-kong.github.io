<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史资讯归档 · AI News Radar</title>
<meta name="description" content="按日期回看 AI News Radar 的历史资讯，数据来自上游仓库 git 历史与本地 archive.json。">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<style>
:root { color-scheme: light; --bg:#f6f6f2; --panel:#fff; --line:#e6e4dc; --ink:#1b1b19;
  --muted:#6f6d65; --accent:#c2410c; --accent-soft:#fff1e7; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.wrap { max-width:1000px; margin:0 auto; padding:24px 18px 64px; }
header.hero { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between; margin-bottom:18px; }
.kicker { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
h1 { font-size:23px; margin:0 0 6px; }
.lede { margin:0; color:var(--muted); font-size:14px; }
.btn { display:inline-block; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
.btn:hover { text-decoration:none; border-color:var(--accent); color:var(--accent); }
.bar { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:13px; margin-bottom:14px; }
.bar label { color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
select, input[type=search] { border:1px solid var(--line); border-radius:8px; padding:6px 9px;
  font-size:13px; background:#fff; color:var(--ink); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; background:var(--panel); padding:6px 13px; font-size:13px; cursor:pointer; color:var(--ink); }
.seg button.on { background:var(--accent); color:#fff; }
.stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.chip { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  font-size:12px; color:var(--muted); }
.chip strong { color:var(--ink); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.card-top { display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
.title { font-size:15.5px; font-weight:600; line-height:1.5; }
.score { flex:none; background:var(--accent-soft); color:var(--accent); border-radius:999px;
  padding:1px 9px; font-size:12px; font-weight:600; }
.meta { display:flex; flex-wrap:wrap; gap:9px; color:var(--muted); font-size:12px; margin-top:6px; }
.reason { margin:8px 0 0; font-size:13px; color:#4a4844; }
.summary { margin:6px 0 0; font-size:13px; color:#4a4844; }
.empty { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; color:var(--muted); }
.foot { margin-top:26px; font-size:12px; color:var(--muted); }
.pager { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <p class="kicker">Archive</p>
      <h1>历史资讯归档</h1>
      <p class="lede">按日期回看每天的精选与当日全量条目。数据来自上游 <a href="https://github.com/LearnPrompt/ai-news-radar" target="_blank" rel="noreferrer">ai-news-radar</a> 的 git 历史快照，以及本地 <code>archive.json</code>。</p>
    </div>
    <div>
      <a class="btn" href="../index.html">返回雷达</a>
      <a class="btn" href="../../index.html">返回主页</a>
    </div>
  </header>

  <div class="bar">
    <div class="pager">
      <button class="btn" id="prevDay" title="更早一天">←</button>
      <label>日期 <select id="dateSelect"></select></label>
      <button class="btn" id="nextDay" title="更晚一天">→</button>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="brief" class="on">当日精选</button>
      <button data-view="brief_union">当日精选合集</button>
      <button data-view="items">当日全量</button>
    </div>
    <label>来源 <select id="sourceSelect"></select></label>
    <label>搜索 <input type="search" id="keyword" placeholder="标题关键词"></label>
  </div>

  <div class="stats" id="stats"></div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
const state = { view: 'brief', date: null, source: '全部', keyword: '', days: [], payload: null };
const el = (id) => document.getElementById(id);

function esc(v) {
  return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function pool() {
  const p = state.payload || {};
  if (state.view === 'items') return p.items || [];
  if (state.view === 'brief_union') return p.brief_union || [];
  return p.brief || [];
}

function filtered() {
  const key = state.keyword.toLowerCase();
  return pool().filter((item) => {
    if (state.source !== '全部' && (item.source || '未知') !== state.source) return false;
    if (key) {
      const hay = `${item.title || ''} ${item.summary || ''} ${item.reason || ''}`.toLowerCase();
      if (!hay.includes(key)) return false;
    }
    return true;
  });
}

function card(item) {
  const when = (item.published_at || item.first_seen_at || '').slice(0, 16).replace('T', ' ');
  const score = (item.score === 0 || item.score) ? `<span class="score">${esc(item.score)}</span>` : '';
  const reason = item.reason ? `<p class="reason">理由：${esc(item.reason)}</p>` : '';
  const persona = item.persona_review ? `<p class="reason">锐评：${esc(item.persona_review)}</p>` : '';
  const summary = item.summary ? `<p class="summary">${esc(String(item.summary).slice(0, 240))}</p>` : '';
  const multi = (item.source_count > 1) ? `<span>多源 ${esc(item.source_count)}</span>` : '';
  const importance = item.importance ? `<span>${esc(item.importance)}</span>` : '';
  return `
    <article class="card">
      <div class="card-top">
        <a class="title" href="${esc(item.url || '#')}" target="_blank" rel="noreferrer">${esc(item.title)}</a>
        ${score}
      </div>
      <div class="meta">
        <span>${esc(item.source || '未知')}</span>
        ${item.topic ? `<span>${esc(item.topic)}</span>` : ''}
        ${importance}
        ${multi}
        ${when ? `<span>${esc(when)}</span>` : ''}
      </div>
      ${reason}
      ${persona}
      ${summary}
    </article>`;
}

function renderStats() {
  const p = state.payload || {};
  const counts = p.counts || {};
  const shown = filtered().length;
  el('stats').innerHTML = [
    ['日期', p.date || '-'],
    ['当日精选', counts.brief || 0],
    ['精选合集', counts.brief_union || 0],
    ['当日全量', counts.items || 0],
    ['当天快照数', p.brief_snapshots || 0],
    ['当前显示', shown],
  ].map(([k, v]) => `<span class="chip">${esc(k)} <strong>${esc(v)}</strong></span>`).join('');
}

function renderList() {
  renderStats();
  const items = filtered();
  el('list').innerHTML = items.length
    ? items.map(card).join('')
    : '<div class="empty">这一天在当前视图下没有条目。试试切换到「当日全量」，或清掉筛选条件。</div>';
}

function renderSourceOptions() {
  const counts = new Map();
  pool().forEach((item) => {
    const name = item.source || '未知';
    counts.set(name, (counts.get(name) || 0) + 1);
  });
  const names = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).map(([n, c]) => `${n} (${c})`);
  const values = Array.from(counts.keys()).sort((a, b) => counts.get(b) - counts.get(a));
  el('sourceSelect').innerHTML = ['<option value="全部">全部</option>']
    .concat(values.map((v, i) => `<option value="${esc(v)}">${esc(names[i])}</option>`)).join('');
  el('sourceSelect').value = counts.has(state.source) ? state.source : '全部';
  state.source = el('sourceSelect').value;
}

async function loadDay(date) {
  const res = await fetch(`../data/history/${date}.json`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`无法加载 ${date} 的归档`);
  state.payload = await res.json();
  state.date = date;
  el('dateSelect').value = date;
  const meta = state.days.find((d) => d.date === date) || {};
  if (!(state.payload.brief || []).length && (state.payload.items || []).length) state.view = 'items';
  el('viewSeg').querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.dataset.view === state.view);
  });
  renderSourceOptions();
  renderList();
  el('foot').textContent = `本页数据为静态 JSON，无后端。精选快照 ${meta.brief_snapshots || 0} 份，`
    + `来源：上游 git 历史 + 本地 archive.json。`;
}

function step(offset) {
  const index = state.days.findIndex((d) => d.date === state.date);
  const next = state.days[index + offset];
  if (next) loadDay(next.date).catch(fail);
}

function fail(error) {
  el('list').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
}

async function init() {
  el('viewSeg').querySelectorAll('button').forEach((button) => {
    button.addEventListener('click', () => {
      el('viewSeg').querySelectorAll('button').forEach((b) => b.classList.remove('on'));
      button.classList.add('on');
      state.view = button.dataset.view;
      renderSourceOptions();
      renderList();
    });
  });
  el('dateSelect').addEventListener('change', () => loadDay(el('dateSelect').value).catch(fail));
  el('sourceSelect').addEventListener('change', () => { state.source = el('sourceSelect').value; renderList(); });
  el('keyword').addEventListener('input', () => { state.keyword = el('keyword').value.trim(); renderList(); });
  el('prevDay').addEventListener('click', () => step(1));
  el('nextDay').addEventListener('click', () => step(-1));
  document.addEventListener('keydown', (event) => {
    if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
    if (event.key === 'ArrowLeft') step(1);
    if (event.key === 'ArrowRight') step(-1);
  });

  try {
    const res = await fetch('../data/history/index.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('还没有生成归档，请先运行 tools/build_history.py');
    const manifest = await res.json();
    state.days = manifest.days || [];
    if (!state.days.length) throw new Error('归档为空，请先运行 tools/build_history.py');
    el('dateSelect').innerHTML = state.days.map((d) =>
      `<option value="${esc(d.date)}">${esc(d.date)} · 精选 ${d.brief_count} · 全量 ${d.item_count}</option>`).join('');
    const wanted = new URLSearchParams(location.search).get('date');
    const start = state.days.find((d) => d.date === wanted) || state.days[0];
    await loadDay(start.date);
  } catch (error) {
    fail(error);
  }
}

init();
</script>
</body>
</html>
